name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: Calibration et performance du moteur v2
        run: pytest -m slow -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # env_file est facultatif (required: false) ; le fichier vide est une sécurité pour un Compose plus ancien
      - run: touch .env.production
      - run: docker compose version
      - run: docker compose build api
      - run: docker compose build mellifera
      - name: Image du crawler sans numpy
        run: docker compose run --rm --no-deps mellifera python -c "import sys, mellifera.cli, mellifera.export; assert not {'numpy', 'scipy'} & set(sys.modules)"
      - name: Tests R
        run: docker compose run --rm api Rscript tests/r/test_blup.R
      - name: Test d'intégration (vrai Rscript)
        run: pytest -m docker -v
