name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # env_file est facultatif (required: false) ; le fichier vide est une sécurité pour un Compose plus ancien
      - run: touch .env.production
      - run: docker compose version
      - run: docker compose build api
      - name: Tests R
        run: docker compose run --rm api Rscript tests/r/test_blup.R
      - name: Test d'intégration (vrai Rscript)
        run: pytest -m docker -v
