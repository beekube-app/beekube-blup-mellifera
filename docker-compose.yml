services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-Python
    ports:
      - "${BLUP_API_PORT:-8081}:8081"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
    env_file:
      - path: .env.production
        required: false

  # Crawler Index Mellifera : démarré seulement sur demande (profil), MELLIFERA_CONTACT requis.
  mellifera:
    profiles: ["mellifera"]
    build:
      context: .
      dockerfile: Dockerfile-Mellifera
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env.production
        required: false
